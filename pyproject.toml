[project]
name = "planyourshot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "authlib>=1.9.5",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-google-genai>=4.3.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "psycopg[binary]>=3.3.8",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.33",
    "sentry-sdk>=2.74.0",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planyourshot"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
